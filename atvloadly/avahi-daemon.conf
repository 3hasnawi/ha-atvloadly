# Browse only: the add-on looks for the Apple TV and publishes nothing, so it does not clash with
# Home Assistant's own mDNS (zeroconf) on the same host network.
[server]
use-ipv4=yes
use-ipv6=yes
deny-interfaces=docker0,hassio
ratelimit-interval-usec=1000000
ratelimit-burst=1000
disallow-other-stacks=no

[wide-area]
enable-wide-area=no

[publish]
disable-publishing=yes
disable-user-service-publishing=yes
publish-hinfo=no
publish-workstation=no

[reflector]
enable-reflector=no

[rlimits]
